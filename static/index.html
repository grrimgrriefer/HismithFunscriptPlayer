<!--  static/index.html -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <link rel="stylesheet" href="/site/static/styles.css">
</head>

<body>
    <div id="app">
        <div id="directory-container">
            <h1>Video Player</h1>
            <div class="sort-container">
                <span class="sort-label-title">Order by:</span>
                <div class="sort-buttons" id="sort-buttons">
                    <button class="sort-btn" data-sort="peak" title="Sort by Peak Intensity">🔺 <span class="sort-label">Peak</span></button>
                    <button class="sort-btn" data-sort="avg" title="Sort by Average Intensity">🌡️ <span class="sort-label">Avg</span></button>
                    <button class="sort-btn" data-sort="volatility" title="Sort by Volatility">⚡ <span class="sort-label">Volatility</span></button>
                </div>
            </div>
            <div id="search-container-placeholder"></div>
            <div id="directory-tree"></div>
        </div>
        <div id="video-container" class="hidden">
            <div id="video-wrapper">
                <div id="video-player"></div>
                <div id="video-error-overlay" class="hidden">
                    <div class="error-content">
                        <h3>Playback Error</h3>
                        <p id="video-error-text"></p>
                    </div>
                </div>
                <div id="next-video-overlay" class="hidden">
                    <div class="overlay-card wide">
                        <h3>Up Next</h3>
                        <div id="next-timer">Starting random video in 6s...</div>

                        <div class="next-options-row">
                            <button id="next-lower-btn" class="next-card lower">
                                <img class="next-thumb" src="" alt="">
                                <div class="next-info">
                                    <span class="next-label">Lower</span>
                                    <span class="next-stats"></span>
                                </div>
                            </button>

                            <button id="next-similar-btn" class="next-card similar">
                                <img class="next-thumb" src="" alt="">
                                <div class="next-info">
                                    <span class="next-label">Similar</span>
                                    <span class="next-stats"></span>
                                </div>
                            </button>

                            <button id="next-higher-btn" class="next-card higher">
                                <img class="next-thumb" src="" alt="">
                                <div class="next-info">
                                    <span class="next-label">Higher</span>
                                    <span class="next-stats"></span>
                                </div>
                            </button>
                        </div>

                        <div class="overlay-footer">
                            <button id="next-replay-btn" class="btn btn-sm">Replay Current</button>
                            <button id="next-cancel-btn" class="btn btn-sm">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button id="toggle-directory">Toggle Directory</button>
        <button id="settings-button" class="player-button btn">Settings</button>

        <div id="settings-menu" class="settings-menu" aria-hidden="true">
            <div class="form-group">
                <label class="settings-label">SBS 3D Mode:</label>
                <input type="checkbox" id="sbs-toggle" id="sbs-toggle-input">
            </div>
            <div class="form-group">
                <button id="loop-toggle" class="btn">Loop: Off</button>
            </div>

            <label class="settings-label">Funscript Variant:</label>
            <div class="variant-row">
                <select id="funscript-variant-select" class="settings-select">
                    <option value="original">original</option>
                </select>
                <button id="refresh-variants-button" class="btn btn-sm">Refresh</button>
            </div>

            <div class="form-group mt-sm">
                <button id="calibration-button" class="btn btn-sm">Calibration</button>
            </div>

            <label class="settings-label mt-sm">Max Intensity Limit:</label>
            <div class="input-row mb-sm">
                <button id="hard-limit-lock-button" class="btn btn-sm">Unlock</button>
                <input id="hard-limit-input" class="settings-input" type="number" min="0" max="100" value="60"
                    disabled />
            </div>

            <label class="settings-label">Vibrate Mode:</label>
            <select id="vibrate-mode-select" class="settings-select">
                <option value="Rate">Rate</option>
                <option value="Beat">Beat</option>
            </select>

            <label class="settings-label">Speed Modulation:</label>
            <select id="speed-mode-select" class="settings-select">
                <option value="quarterbeat">Quarter-beat (0.25x)</option>
                <option value="halfbeat">Half-beat (0.5x)</option>
                <option value="normal">Normal (1.0x)</option>
                <option value="doublebeat">Double-beat (2.0x)</option>
            </select>

            <div id="settings-intensity-info" class="form-group">
                Intensity: <span id="settings-peak-val" class="bold-val">--</span> peak,
                <span id="settings-avg-val" class="bold-val">--</span> avg
            </div>

            <div class="mt-sm">
                <button id="open-editor-button" class="btn">Open Editor</button>
            </div>
        </div>
    </div>
    <script src="/site/static/main.js" type="module"></script>
</body>

</html>
